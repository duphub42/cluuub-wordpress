<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
  <title id="title">cluuub Embed data flow</title>
  <desc id="desc">The WordPress server requests public club data from cluuub over HTTPS, caches the response briefly, and renders it for website visitors.</desc>
  <rect width="1040" height="300" rx="24" fill="#f8fafc"/>
  <g font-family="Arial,sans-serif">
    <rect x="40" y="62" width="250" height="170" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="68" y="90" width="52" height="46" rx="9" fill="#dbeafe"/>
    <path d="M78 102h32M78 112h32M78 122h23" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="68" y="169" font-size="20" font-weight="700" fill="#0f172a">Visitor browser</text>
    <text x="68" y="196" font-size="14" fill="#64748b">Requests the WordPress page</text>

    <rect x="394" y="42" width="250" height="210" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="422" y="70" width="52" height="46" rx="9" fill="#eff6ff"/>
    <path d="M432 82h32M432 92h32M432 102h23" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <text x="422" y="149" font-size="20" font-weight="700" fill="#0f172a">WordPress server</text>
    <text x="422" y="176" font-size="14" fill="#64748b">Fetches and safely renders</text>
    <text x="422" y="199" font-size="14" fill="#64748b">public data; cache: 5 min</text>

    <rect x="750" y="62" width="250" height="170" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="790" cy="113" r="25" fill="#dcfce7"/>
    <path d="M778 115c7-15 22-15 29 0M782 125c5-9 16-9 21 0" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <text x="778" y="169" font-size="20" font-weight="700" fill="#0f172a">cluuub API</text>
    <text x="778" y="196" font-size="14" fill="#64748b">Returns public club data</text>

    <path d="M290 130h95" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M644 130h95" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="297" y="112" font-size="12" fill="#64748b">page HTML</text>
    <text x="656" y="112" font-size="12" fill="#2563eb">HTTPS + club slug</text>
    <text x="355" y="278" font-size="13" fill="#64748b">Visitors' browsers do not call the cluuub API directly for this widget.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
</svg>
